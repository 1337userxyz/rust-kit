[workspace]
resolver = "2"
members = [
    "crates/kit-fs",
    "crates/kit-logging",
    "crates/kit-launcher",
    "crates/kit-dialog",
    "crates/kit-csv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tristan"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
directories = "6.0"
log = "0.4"
chrono = "0.4"
rfd = "0.17"
csv = "1.3"
encoding_rs = "0.8"
